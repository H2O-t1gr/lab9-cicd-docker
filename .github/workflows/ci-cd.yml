name: CI/CD Docker to EC2

on:
  push:
    branches:
      - main

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/nodejs-api-cicd:${{ github.sha }}
  CONTAINER_PORT: 3001
  HOST_PORT: 3002

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Check application
        run: |
          docker run -d --name lab9-test -p 3002:${CONTAINER_PORT} "$IMAGE"
          sleep 3
          RESPONSE=$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors http://localhost:3002/) || { docker logs lab9-test; exit 1; }
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q "Lab9"
          docker rm -f lab9-test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ vars.EC2_FINGERPRINT }}
          envs: IMAGE,HOST_PORT,CONTAINER_PORT
          script: |
            sudo docker pull "$IMAGE"
            sudo docker rm -f student-cicd-app || true
            sudo docker run -d --name student-cicd-app \
              --restart unless-stopped \
              -p "${HOST_PORT}:${CONTAINER_PORT}" "$IMAGE"
